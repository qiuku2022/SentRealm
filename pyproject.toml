[project]
name = "sentrealm"
version = "0.5.1"
description = "Local text preprocessing for video creators (Jianying draft matching)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "mcp>=1.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
sentrealm = "sentrealm_cli.main:app"
sentrealm-mcp = "sentrealm_mcp.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "packages/core/src",
    "packages/cli/src",
    "packages/mcp/src",
    ".",
]
include = ["apps*", "sentrealm_*"]

[tool.setuptools.package-data]
sentrealm_core = ["data/break_lexicon/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that require real LLM API access",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
packaging = [
    "pyinstaller>=6.11",
]

[tool.uv]
managed = true
